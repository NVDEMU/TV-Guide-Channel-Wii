name: Wii Channel Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wii:
    name: Build TV Guide USA DOL
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Wii SDK libraries
        run: |
          dkp-pacman -Q | grep -E 'devkitppc|libogc|libfat' || true
          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"

      - name: Compile the Wii application
        run: |
          make -C wii clean
          make -C wii EXTRA_CFLAGS=-Werror

      - name: Verify expected DOL exists
        run: |
          test -s wii/tv-guide-usa.dol
          test -s wii/tv-guide-usa.elf

      - name: Upload development build
        uses: actions/upload-artifact@v6
        with:
          name: tv-guide-usa-wii-${{ github.sha }}
          if-no-files-found: error
          path: |
            wii/tv-guide-usa.dol
            wii/tv-guide-usa.elf
            wii/tv-guide-usa.map

  publish-nightly:
    name: Publish TV Guide USA Nightly DOL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-wii
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v6
        with:
          name: tv-guide-usa-wii-${{ github.sha }}
          path: dist

      - name: Publish or update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: TV Guide USA Nightly
          body: |
            Automated US-English Wii homebrew frontend build from the latest main commit.

            This release contains the DOL executable for testing. It is not a WAD. WAD packaging requires local/user-supplied base WAD and banner/icon U8 archives; see docs/WAD-BUILD.md. Test in Dolphin before attempting to install anything on a real Wii.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/tv-guide-usa.dol
            dist/tv-guide-usa.elf
            dist/tv-guide-usa.map

  wad-tools-check:
    name: Validate local WAD packaging tools
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test Python tooling and shell syntax
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q backend tests tools
          python -m pytest -q
          bash -n tools/package-wad.sh
          python tools/inspect_wad.py --help
          python tools/prepare_wad_tool.py --help

      - name: Fetch the local WAD packager source
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/davi-x86/WadPakk.git .tools/WadPakk
          python tools/prepare_wad_tool.py .tools/WadPakk

      - name: Build portable WAD packager and asset extractor
        run: |
          dotnet build .tools/WadPakk/WadPakk.csproj --configuration Release
          dotnet build tools/wad-assets/WadAssetExtractor.csproj --configuration Release -p:WADPAKK_DIR="$PWD/.tools/WadPakk"
