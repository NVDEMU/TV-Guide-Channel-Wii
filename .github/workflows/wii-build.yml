name: Wii Channel Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      build_native_preview:
        description: "Download and patch the original TV no Tomo title into a short-lived native-UI preview (NUS access required)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-guide-snapshot:
    name: Fetch attributed TV guide snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python for build tools
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch TVmaze schedules and generate four timezone snapshots
        run: python tools/build_tvmaze_guide.py

      - name: Upload the generated C data used by the DOL build
        uses: actions/upload-artifact@v6
        with:
          name: tv-guide-usa-embedded-source-${{ github.sha }}
          if-no-files-found: error
          path: wii/source/embedded_guide_data.inc

      - name: Upload user-visible timezone files and source status
        uses: actions/upload-artifact@v6
        with:
          name: tv-guide-usa-guide-files-${{ github.sha }}
          if-no-files-found: error
          path: build/guide/*

  build-wii:
    name: Build TV Guide USA DOL
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    timeout-minutes: 15
    needs: build-guide-snapshot
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download generated guide snapshot
        uses: actions/download-artifact@v6
        with:
          name: tv-guide-usa-embedded-source-${{ github.sha }}
          path: wii/source

      - name: Verify Wii SDK libraries
        run: |
          dkp-pacman -Q | grep -E 'devkitppc|libogc|libfat' || true
          test -x "$DEVKITPPC/bin/powerpc-eabi-gcc"

      - name: Compile the Wii application
        run: |
          make -C wii clean
          make -C wii EXTRA_CFLAGS=-Werror

      - name: Verify expected DOL exists
        run: |
          test -s wii/tv-guide-usa.dol
          test -s wii/tv-guide-usa.elf

      - name: Upload development build
        uses: actions/upload-artifact@v6
        with:
          name: tv-guide-usa-wii-${{ github.sha }}
          if-no-files-found: error
          path: |
            wii/tv-guide-usa.dol
            wii/tv-guide-usa.elf
            wii/tv-guide-usa.map

  package-installable-wad:
    name: Build standalone WAD and Dolphin test kit
    runs-on: macos-latest
    timeout-minutes: 25
    needs: [build-wii, build-guide-snapshot]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download built DOL
        uses: actions/download-artifact@v6
        with:
          name: tv-guide-usa-wii-${{ github.sha }}
          path: dist

      - name: Download generated guide snapshots
        uses: actions/download-artifact@v6
        with:
          name: tv-guide-usa-guide-files-${{ github.sha }}
          path: build/guide

      - name: Fetch and build WadPakk's bundled-template packager
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/davi-x86/WadPakk.git .tools/WadPakk
          test -s .tools/WadPakk/Resources/base.wad
          python tools/prepare_wad_tool.py .tools/WadPakk
          dotnet build .tools/WadPakk/WadPakk.csproj --configuration Release
          dotnet build tools/wad-assets/WadAssetExtractor.csproj --configuration Release -p:WADPAKK_DIR="$PWD/.tools/WadPakk"
          dotnet build tools/native-patcher/NativeTitlePatcher.csproj --configuration Release -p:WADPAKK_DIR="$PWD/.tools/WadPakk"

      - name: Package WAD without a user-supplied base
        env:
          TV_GUIDE_DOL: ${{ github.workspace }}/dist/tv-guide-usa.dol
          TV_GUIDE_WAD_OUTPUT: ${{ github.workspace }}/build/TV-Guide-USA.wad
          WADPAKK_DIR: ${{ github.workspace }}/.tools/WadPakk
        run: bash tools/package-wad.sh

      - name: Assemble Dolphin Homebrew Channel test kit
        run: |
          mkdir -p build/TV-Guide-USA-Dolphin-Test-Kit/sd/apps/tv-guide-channel-wii
          cp dist/tv-guide-usa.dol build/TV-Guide-USA-Dolphin-Test-Kit/sd/apps/tv-guide-channel-wii/boot.dol
          cp build/guide/guide-*.txt build/TV-Guide-USA-Dolphin-Test-Kit/sd/apps/tv-guide-channel-wii/
          cp wii/config.ini.example build/TV-Guide-USA-Dolphin-Test-Kit/sd/apps/tv-guide-channel-wii/config.ini.example
          cp build/TV-Guide-USA.wad build/TV-Guide-USA-Dolphin-Test-Kit/
          cp build/guide/source-status.json build/TV-Guide-USA-Dolphin-Test-Kit/
          printf '%s\n' 'This is a standalone prototype WAD; the original TV no Tomo UI/assets have not been patched.' > build/TV-Guide-USA-Dolphin-Test-Kit/PROTOTYPE-NOTICE.txt
          cd build && zip -qr TV-Guide-USA-Dolphin-Test-Kit.zip TV-Guide-USA-Dolphin-Test-Kit

      - name: Upload WAD and Dolphin test kit
        uses: actions/upload-artifact@v6
        with:
          name: tv-guide-usa-wad-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/TV-Guide-USA.wad
            build/TV-Guide-USA-Dolphin-Test-Kit.zip

  publish-nightly:
    name: Publish TV Guide USA Nightly DOL, WAD, and guide files
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    needs: [build-wii, build-guide-snapshot, package-installable-wad]
    runs-on: ubuntu-latest
    steps:
      - name: Download DOL build output
        uses: actions/download-artifact@v6
        with:
          name: tv-guide-usa-wii-${{ github.sha }}
          path: dist

      - name: Download guide snapshots
        uses: actions/download-artifact@v6
        with:
          name: tv-guide-usa-guide-files-${{ github.sha }}
          path: dist/guide-files

      - name: Download WAD and Dolphin test kit
        uses: actions/download-artifact@v6
        with:
          name: tv-guide-usa-wad-${{ github.sha }}
          path: dist/wad

      - name: Publish or update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: TV Guide USA Nightly
          body: |
            Automated US-English Wii homebrew prototype build from the latest main commit.

            This release includes a DOL, standalone WAD, Dolphin/Homebrew Channel test kit, and four TVmaze schedule snapshots. It no longer requires a Japanese base WAD to generate the standalone prototype WAD.

            Important: this standalone prototype WAD does not yet reproduce or translate the original TV no Tomo application/banner. It uses a generic homebrew WAD template and a new app frontend. The next milestone is reverse-engineering/localizing the original title while preserving its original interface. The built-in TVmaze schedule snapshot is CC BY-SA; attribution is shown in the UI.
            
            Recommended: install the WAD in a separate Dolphin NAND for testing. A successful build is not proof that it boots on every emulator/hardware configuration. Do not install on real hardware until Dolphin testing succeeds.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/tv-guide-usa.dol
            dist/tv-guide-usa.elf
            dist/tv-guide-usa.map
            dist/guide-files/guide-eastern.txt
            dist/guide-files/guide-central.txt
            dist/guide-files/guide-mountain.txt
            dist/guide-files/guide-pacific.txt
            dist/guide-files/source-status.json
            dist/wad/TV-Guide-USA.wad
            dist/wad/TV-Guide-USA-Dolphin-Test-Kit.zip

  native-ui-preview:
    name: Build native TV no Tomo UI localization preview
    if: github.event_name == 'workflow_dispatch' && inputs.build_native_preview
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python for WAD structural validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download tooling and build the native localization patcher
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/davi-x86/WadPakk.git .tools/WadPakk
          python tools/prepare_wad_tool.py .tools/WadPakk
          dotnet build tools/native-patcher/NativeTitlePatcher.csproj --configuration Release -p:WADPAKK_DIR="$PWD/.tools/WadPakk"

      - name: Download latest original TV no Tomo title from NUS and localize its native UI
        env:
          WADPAKK_DIR: ${{ github.workspace }}/.tools/WadPakk
        run: |
          mkdir -p build
          dotnet run --project tools/native-patcher/NativeTitlePatcher.csproj --configuration Release -p:WADPAKK_DIR="$PWD/.tools/WadPakk" -- --download-latest "$PWD/build/TV-Guide-USA-Native-UI-Preview.wad" "$PWD/translations/native-english-messages.json"
          python tools/inspect_wad.py build/TV-Guide-USA-Native-UI-Preview.wad

      - name: Upload one-day native UI preview for Dolphin testing
        uses: actions/upload-artifact@v6
        with:
          name: tv-guide-usa-native-ui-preview-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            build/TV-Guide-USA-Native-UI-Preview.wad

  wad-tools-check:
    name: Validate guide and WAD packaging tools
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test Python tooling and shell syntax
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q backend tests tools
          python -m pytest -q
          python tools/build_tvmaze_guide.py --offline-demo --output-dir "$RUNNER_TEMP/guide-test" --c-output "$RUNNER_TEMP/guide-test/embedded_guide_data.inc"
          grep -q 'TVGUIDE|1|US-EN|America/New_York|DEMO' "$RUNNER_TEMP/guide-test/guide-eastern.txt"
          bash -n tools/package-wad.sh
          python tools/inspect_wad.py --help
          python tools/prepare_wad_tool.py --help

      - name: Fetch the local WAD packager source
        run: |
          mkdir -p .tools
          git clone --depth 1 https://github.com/davi-x86/WadPakk.git .tools/WadPakk
          python tools/prepare_wad_tool.py .tools/WadPakk

      - name: Build portable WAD packager and asset extractor
        run: |
          dotnet build .tools/WadPakk/WadPakk.csproj --configuration Release
          dotnet build tools/wad-assets/WadAssetExtractor.csproj --configuration Release -p:WADPAKK_DIR="$PWD/.tools/WadPakk"
